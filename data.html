<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darjeeling Homestays Directory</title>
    <style>
        /* Modern Reset & Typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --tag-bg: #f0fdf4;
            --tag-text: #166534;
            --tag-border: #bbf7d0;
            --primary: #0d9488;
        }
        
        /* Dark Mode Variables */
        body.dark-mode {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: #1e293b;
            --border-color: #334155;
            --tag-bg: #064e3b;
            --tag-text: #6ee7b7;
            --tag-border: #047857;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* Utility */
        .hidden { display: none !important; }

        /* Header */
        header {
            background: linear-gradient(135deg, #1e3a8a, var(--primary));
            color: white;
            text-align: center;
            padding: 3rem 1rem;
            position: relative;
        }
        header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .theme-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }
        .theme-toggle:hover { background: rgba(255, 255, 255, 0.3); }

        /* Layout Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        
        .refresh-notice {
            background-color: rgba(13, 148, 136, 0.1);
            color: var(--primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 600;
            border: 1px solid var(--primary);
        }

        /* Filter Box */
        .filter-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            border: 1px solid var(--border-color);
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .filter-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }
        .filter-card input[type="text"], .filter-card select {
            width: 100%;
            padding: 0.625rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background: var(--card-bg);
            color: var(--text-main);
            outline: none;
        }
        .filter-card input:focus, .filter-card select:focus {
            border-color: var(--primary);
        }
        
        /* Custom Range Slider */
        input[type=range] { width: 100%; margin: 7px 0; cursor: pointer; }
        #priceDisplay { color: var(--primary); font-weight: 700; }

        /* Grid & Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .card-img {
            height: 200px;
            width: 100%;
            object-fit: cover;
            background: #cbd5e1;
        }
        .card-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-header h2 {
            font-size: 1.25rem;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }
        .card-location {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-bottom: 0.75rem;
        }
        .price-tag {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        .price-tag span {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Tags */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1.25rem;
        }
        .tag {
            background: var(--tag-bg);
            color: var(--tag-text);
            border: 1px solid var(--tag-border);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
        }
        .tag-amenity {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        /* Buttons */
        .btn {
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s, transform 0.1s;
            cursor: pointer;
            border: none;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary); width: 100%; padding: 0.75rem; margin-top: auto; }
        .btn-call { background-color: #0284c7; }
        .btn-wa { background-color: #25D366; }
        .btn-map { background-color: #10b981; }
        .btn-yt { background-color: #FF0000; }
        .btn-fb { background-color: #1877F2; }
        .btn-ig { background-color: #E4405F; }
        .btn-web { background-color: #334155; }
        .btn-share { background-color: #8b5cf6; }
        .btn-back { background-color: var(--border-color); color: var(--text-main); margin-bottom: 1.5rem; display: inline-block; }

        /* No Results State */
        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* --- Profile Page Styles --- */
        .profile-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }
        .profile-hero { width: 100%; height: 400px; object-fit: cover; }
        .profile-body { padding: 2.5rem; }
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .profile-title h2 { font-size: 2rem; margin-bottom: 0.25rem; }
        .profile-desc {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.7;
        }
        .profile-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }
        
        @media (max-width: 600px) {
            .profile-hero { height: 250px; }
            .profile-body { padding: 1.5rem; }
            .profile-header { flex-direction: column; }
        }
    </style>
</head>
<body>

<header>
    <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
    <h1>Darjeeling Homestays Directory</h1>
    <p>Find local stays across Darjeeling, Lamahatta, Sitong, Takdah, and beyond.</p>
</header>

<div class="container">
    
    <!-- ================= MAIN DIRECTORY VIEW ================= -->
    <div id="main-view">
        <div class="refresh-notice">
            💡 Showing up to 10 unique homestays per visit. Refresh to cycle through the directory!
        </div>

        <!-- Filter Section -->
        <div class="filter-card">
            <div class="filter-group">
                <label for="searchInput">Search Name</label>
                <input type="text" id="searchInput" placeholder="e.g. Kanchenjunga..." />
            </div>
            <div class="filter-group">
                <label for="locationFilter">Location</label>
                <select id="locationFilter"><option value="all">All Locations</option></select>
            </div>
            <div class="filter-group">
                <label for="sceneFilter">Scenery</label>
                <select id="sceneFilter"><option value="all">All Scenery</option></select>
            </div>
            <div class="filter-group">
                <label for="priceFilter">
                    Max Price <span id="priceDisplay">₹5000</span>
                </label>
                <input type="range" id="priceFilter" min="500" max="5000" step="100" value="5000" />
            </div>
        </div>

        <div class="grid" id="homestayGrid"></div>
    </div>

    <!-- ================= HOMESTAY PROFILE VIEW ================= -->
    <div id="profile-view" class="hidden">
        <button class="btn btn-back" onclick="closeProfile()">← Back to Directory</button>
        <div class="profile-card" id="profileContainer"></div>
    </div>

</div>

<script>
    // ==========================================
    // 1. EXTENDED JSON DATA (5 High-Detail Items)
    // ==========================================
    const allHomestaysData = [
        {
            "id": 1,
            "name": "Kanchenjunga Cascade Homestay",
            "location": "Lamahatta",
            "price": 1500,
            "scenery": ["Kanchenjunga View", "Pine Forest"],
            "amenities": ["Free Wi-Fi", "Bonfire", "Home-cooked Meals", "Geyser"],
            "description": "Nestled in the serene pine forests of Lamahatta, this homestay offers breathtaking, unobstructed views of Mt. Kanchenjunga. Enjoy organic home-cooked meals, evening bonfires, and a peaceful retreat away from city noise. Perfect for nature lovers and couples.",
            "image": "https://images.unsplash.com/photo-1544463428-21d3e8e6ab20?auto=format&fit=crop&w=800&q=80",
            "phone": "+919876543210",
            "whatsapp": "919876543210",
            "facebook": "https://facebook.com",
            "instagram": "https://instagram.com",
            "youtube": "https://youtube.com",
            "googleMap": "https://maps.google.com/?q=Lamahatta",
            "website": "https://example.com"
        },
        {
            "id": 2,
            "name": "Sitong Orange Blossom Stay",
            "location": "Sitong",
            "price": 1800,
            "scenery": ["Orange Orchard", "Valley View"],
            "amenities": ["Bird Watching", "Parking", "Organic Farm"],
            "description": "Located in the heart of the Orange Village, this beautiful eco-stay allows you to wake up to the sweet scent of citrus and panoramic valley views. During winter, the trees are loaded with oranges. We arrange local bird-watching tours and village walks.",
            "image": "https://images.unsplash.com/photo-1506012787146-f92b2d7d6d96?auto=format&fit=crop&w=800&q=80",
            "phone": "+919876543211",
            "whatsapp": "919876543211",
            "facebook": "https://facebook.com",
            "instagram": "https://instagram.com",
            "googleMap": "https://maps.google.com/?q=Sitong"
        },
        {
            "id": 3,
            "name": "Takdah Heritage Eco Lodge",
            "location": "Takdah",
            "price": 2500,
            "scenery": ["Tea Garden", "Pine Forest"],
            "amenities": ["Heritage Rooms", "Fireplace", "Tea Tasting", "Wi-Fi"],
            "description": "Experience colonial charm in our British-era heritage bungalow in Takdah. Surrounded by lush tea gardens and dense cedar forests, this lodge offers antique wooden interiors, a vintage fireplace, and the finest Darjeeling tea brewed fresh from the estate.",
            "image": "https://images.unsplash.com/photo-1510798831971-661eb04b3739?auto=format&fit=crop&w=800&q=80",
            "phone": "+919876543212",
            "whatsapp": "919876543212",
            "instagram": "https://instagram.com",
            "youtube": "https://youtube.com",
            "googleMap": "https://maps.google.com/?q=Takdah",
            "website": "https://example.com"
        },
        {
            "id": 4,
            "name": "Darjeeling Mist Haven",
            "location": "Darjeeling Town",
            "price": 1200,
            "scenery": ["Town View", "Kanchenjunga View"],
            "amenities": ["Fast Wi-Fi", "Near Mall Road", "24/7 Hot Water"],
            "description": "A cozy, budget-friendly stay just 15 minutes walking distance from the Mall Road. Enjoy the glittering lights of Darjeeling town at night and the majestic snow-capped peaks in the morning. Fast Wi-Fi available for workation travelers.",
            "image": "https://images.unsplash.com/photo-1626014903706-5381ce5b5b04?auto=format&fit=crop&w=800&q=80",
            "phone": "+919876543213",
            "whatsapp": "919876543213",
            "facebook": "https://facebook.com",
            "googleMap": "https://maps.google.com/?q=Darjeeling"
        },
        {
            "id": 5,
            "name": "Mirik Lake View Cottage",
            "location": "Mirik",
            "price": 2000,
            "scenery": ["Lake View", "Tea Garden"],
            "amenities": ["Private Balcony", "Boating Access", "Pet Friendly"],
            "description": "Wake up to the tranquil waters of Sumendu Lake. Our wooden cottages offer a private balcony, modern amenities, and a direct walking path down to the lake. We offer boating arrangements and horse riding on request.",
            "image": "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=800&q=80",
            "phone": "+919876543214",
            "whatsapp": "919876543214",
            "youtube": "https://youtube.com",
            "googleMap": "https://maps.google.com/?q=Mirik"
        }
    ];

    let activeHomestays = []; 

    // ==========================================
    // 2. LOGIC: THEME TOGGLE & SHARE
    // ==========================================
    function toggleTheme() {
        const body = document.body;
        const btn = document.querySelector('.theme-toggle');
        body.classList.toggle('dark-mode');
        
        if (body.classList.contains('dark-mode')) {
            btn.textContent = '☀️ Light Mode';
        } else {
            btn.textContent = '🌙 Dark Mode';
        }
    }

    function shareHomestay(name) {
        navigator.clipboard.writeText(window.location.href).then(() => {
            alert(`Link for ${name} copied to clipboard!`);
        });
    }

    // ==========================================
    // 3. LOGIC: EQUAL CHANCE ROTATION (Session Storage)
    // ==========================================
    function initializeRotation() {
        const BATCH_SIZE = 10; 
        let unshownIds = JSON.parse(sessionStorage.getItem('unshownHomestays'));

        if (!unshownIds || unshownIds.length === 0) {
            const allIds = allHomestaysData.map(h => h.id);
            unshownIds = allIds.sort(() => 0.5 - Math.random());
        }

        const currentBatchIds = unshownIds.splice(0, BATCH_SIZE);
        sessionStorage.setItem('unshownHomestays', JSON.stringify(unshownIds));
        activeHomestays = allHomestaysData.filter(h => currentBatchIds.includes(h.id));
    }

    // ==========================================
    // 4. DOM & RENDERING
    // ==========================================
    const grid = document.getElementById('homestayGrid');
    const searchInput = document.getElementById('searchInput');
    const locationFilter = document.getElementById('locationFilter');
    const sceneFilter = document.getElementById('sceneFilter');
    const priceFilter = document.getElementById('priceFilter');
    const priceDisplay = document.getElementById('priceDisplay');

    function setupDropdowns() {
        const locations = [...new Set(activeHomestays.map(item => item.location))].sort();
        const sceneries = [...new Set(activeHomestays.flatMap(item => item.scenery))].sort();

        locations.forEach(loc => locationFilter.appendChild(new Option(loc, loc)));
        sceneries.forEach(sc => sceneFilter.appendChild(new Option(sc, sc)));
    }

    function renderCards(data) {
        grid.innerHTML = '';
        if (data.length === 0) {
            grid.innerHTML = '<div class="no-results">No homestays match your search criteria.</div>';
            return;
        }

        data.forEach(stay => {
            const tagsHtml = stay.scenery.map(s => `<span class="tag">🌿 ${s}</span>`).join('');
            
            grid.innerHTML += `
                <div class="card">
                    <img src="${stay.image}" alt="${stay.name}" class="card-img" />
                    <div class="card-content">
                        <div class="card-header">
                            <h2>${stay.name}</h2>
                            <div class="card-location">📍 ${stay.location}</div>
                        </div>
                        <div class="price-tag">₹${stay.price} <span>/ night</span></div>
                        <div class="tags">${tagsHtml}</div>
                        <button class="btn btn-primary" onclick="openProfile(${stay.id})">View Details</button>
                    </div>
                </div>
            `;
        });
    }

    // ==========================================
    // 5. PROFILE PAGE SPA NAVIGATION
    // ==========================================
    function openProfile(id) {
        const stay = activeHomestays.find(s => s.id === id);
        if (!stay) return;

        // Generate Action Buttons Dynamically
        let buttonsHtml = '';
        if (stay.phone) buttonsHtml += `<a href="tel:${stay.phone}" class="btn btn-call">📞 Call Now</a>`;
        if (stay.whatsapp) buttonsHtml += `<a href="https://wa.me/${stay.whatsapp}" target="_blank" class="btn btn-wa">💬 WhatsApp</a>`;
        if (stay.googleMap) buttonsHtml += `<a href="${stay.googleMap}" target="_blank" class="btn btn-map">📍 Map</a>`;
        if (stay.website) buttonsHtml += `<a href="${stay.website}" target="_blank" class="btn btn-web">🌐 Website</a>`;
        if (stay.facebook) buttonsHtml += `<a href="${stay.facebook}" target="_blank" class="btn btn-fb">Facebook</a>`;
        if (stay.instagram) buttonsHtml += `<a href="${stay.instagram}" target="_blank" class="btn btn-ig">Instagram</a>`;
        if (stay.youtube) buttonsHtml += `<a href="${stay.youtube}" target="_blank" class="btn btn-yt">📺 Video</a>`;
        
        buttonsHtml += `<button class="btn btn-share" onclick="shareHomestay('${stay.name}')">🔗 Share</button>`;

        const sceneryTags = stay.scenery.map(s => `<span class="tag">🌿 ${s}</span>`).join('');
        const amenityTags = stay.amenities ? stay.amenities.map(a => `<span class="tag tag-amenity">✨ ${a}</span>`).join('') : '';

        document.getElementById('profileContainer').innerHTML = `
            <img src="${stay.image}" alt="${stay.name}" class="profile-hero" />
            <div class="profile-body">
                <div class="profile-header">
                    <div class="profile-title">
                        <h2>${stay.name}</h2>
                        <div class="card-location" style="font-size:1.1rem;">📍 ${stay.location}</div>
                    </div>
                    <div class="price-tag" style="font-size:1.8rem; margin:0;">
                        ₹${stay.price} <span style="font-size:1rem;">/ night</span>
                    </div>
                </div>
                
                <div class="tags" style="margin-bottom: 1.5rem;">${sceneryTags} ${amenityTags}</div>
                
                <div class="profile-desc">
                    <strong>About this homestay:</strong><br/>
                    ${stay.description}
                </div>

                <div class="profile-actions">
                    ${buttonsHtml}
                </div>
            </div>
        `;

        document.getElementById('main-view').classList.add('hidden');
        document.getElementById('profile-view').classList.remove('hidden');
        window.scrollTo(0, 0); 
    }

    function closeProfile() {
        document.getElementById('profile-view').classList.add('hidden');
        document.getElementById('main-view').classList.remove('hidden');
        window.scrollTo(0, 0);
    }

    // ==========================================
    // 6. FILTER LOGIC
    // ==========================================
    function filterData() {
        const searchText = searchInput.value.toLowerCase().trim();
        const selectedLoc = locationFilter.value;
        const selectedScene = sceneFilter.value;
        const maxPrice = parseInt(priceFilter.value) || 5000;

        priceDisplay.textContent = `₹${maxPrice}`;

        const filtered = activeHomestays.filter(stay => {
            const matchesSearch = stay.name.toLowerCase().includes(searchText) || 
                                  stay.location.toLowerCase().includes(searchText);
            const matchesLoc = selectedLoc === 'all' || stay.location === selectedLoc;
            const matchesScene = selectedScene === 'all' || stay.scenery.includes(selectedScene);
            const matchesPrice = stay.price <= maxPrice;

            return matchesSearch && matchesLoc && matchesScene && matchesPrice;
        });

        renderCards(filtered);
    }

    // ==========================================
    // 7. INIT
    // ==========================================
    initializeRotation();
    setupDropdowns();
    renderCards(activeHomestays);
    
    searchInput.addEventListener('input', filterData);
    locationFilter.addEventListener('change', filterData);
    sceneFilter.addEventListener('change', filterData);
    priceFilter.addEventListener('input', filterData);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darjeeling Homestays Directory</title>
    <style>
        /* Modern Reset & Typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            line-height: 1.5;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #1e3a8a, #0d9488);
            color: white;
            text-align: center;
            padding: 3rem 1rem;
        }
        header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Layout Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Filter Box */
        .filter-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            align-items: center;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .filter-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #475569;
        }
        .filter-card input, .filter-card select {
            width: 100%;
            padding: 0.625rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .filter-card input:focus, .filter-card select:focus {
            border-color: #0d9488;
        }

        /* Grid & Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .card-header h2 {
            font-size: 1.25rem;
            color: #0f172a;
            margin-bottom: 0.25rem;
        }
        .card-location {
            color: #64748b;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-bottom: 0.75rem;
        }
        .price-tag {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0d9488;
            margin-bottom: 1rem;
        }
        .price-tag span {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 400;
        }

        /* Scenery Tags */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1.25rem;
        }
        .tag {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
        }

        /* Buttons Container */
        .links-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: auto;
        }
        .btn {
            text-decoration: none;
            padding: 0.45rem 0.75rem;
            border-radius: 6px;
            font-size: 0.825rem;
            font-weight: 600;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-wa { background-color: #25D366; }
        .btn-map { background-color: #EA4335; }
        .btn-fb { background-color: #1877F2; }
        .btn-ig { background-color: #E4405F; }
        .btn-web { background-color: #334155; }

        /* No Results State */
        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem;
            color: #64748b;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<header>
    <h1>Darjeeling Homestays Directory</h1>
    <p>Find local stays across Darjeeling, Lamahatta, Sitong, Takdah, and beyond.</p>
</header>

<div class="container">
    <!-- Filter Section -->
    <div class="filter-card">
        <div class="filter-group">
            <label for="searchInput">Search Name</label>
            <input type="text" id="searchInput" placeholder="e.g. Kanchenjunga..." />
        </div>
        <div class="filter-group">
            <label for="locationFilter">Location</label>
            <select id="locationFilter">
                <option value="all">All Locations</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="sceneFilter">Scenery / View</label>
            <select id="sceneFilter">
                <option value="all">All Scenery</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="priceFilter">Max Price (₹/night)</label>
            <input type="number" id="priceFilter" placeholder="e.g. 2000" />
        </div>
    </div>

    <!-- Homestays Grid -->
    <div class="grid" id="homestayGrid"></div>
</div>

<script>
    // ==========================================
    // 1. JSON DATA (Easily exportable to database later)
    // ==========================================
    const homestaysData = [
        {
            "id": 1,
            "name": "Kanchenjunga Cascade Homestay",
            "location": "Lamahatta",
            "price": 1500,
            "scenery": ["Kanchenjunga View", "Pine Forest"],
            "whatsapp": "919876543210",
            "facebook": "https://facebook.com",
            "instagram": "https://instagram.com",
            "googleMap": "https://maps.google.com/?q=Lamahatta",
            "website": "https://example.com"
        },
        {
            "id": 2,
            "name": "Sitong Orange Blossom Stay",
            "location": "Sitong",
            "price": 1800,
            "scenery": ["Orange Orchard", "Valley View"],
            "whatsapp": "919876543211",
            "facebook": "https://facebook.com",
            "instagram": "https://instagram.com",
            "googleMap": "https://maps.google.com/?q=Sitong",
            "website": ""
        },
        {
            "id": 3,
            "name": "Takdah Heritage Eco Lodge",
            "location": "Takdah",
            "price": 2200,
            "scenery": ["Tea Garden", "Pine Forest"],
            "whatsapp": "919876543212",
            "facebook": "",
            "instagram": "https://instagram.com",
            "googleMap": "https://maps.google.com/?q=Takdah",
            "website": "https://example.com"
        },
        {
            "id": 4,
            "name": "Darjeeling Mist Haven",
            "location": "Darjeeling Town",
            "price": 1200,
            "scenery": ["Town View", "Kanchenjunga View"],
            "whatsapp": "919876543213",
            "facebook": "https://facebook.com",
            "instagram": "",
            "googleMap": "https://maps.google.com/?q=Darjeeling",
            "website": ""
        },
        {
            "id": 5,
            "name": "Mirik Lake View Cottage",
            "location": "Mirik",
            "price": 2000,
            "scenery": ["Lake View", "Tea Garden"],
            "whatsapp": "919876543214",
            "facebook": "",
            "instagram": "",
            "googleMap": "https://maps.google.com/?q=Mirik",
            "website": ""
        }
    ];

    // ==========================================
    // 2. DOM ELEMENTS
    // ==========================================
    const grid = document.getElementById('homestayGrid');
    const searchInput = document.getElementById('searchInput');
    const locationFilter = document.getElementById('locationFilter');
    const sceneFilter = document.getElementById('sceneFilter');
    const priceFilter = document.getElementById('priceFilter');

    // ==========================================
    // 3. AUTO-POPULATE FILTER DROPDOWNS FROM DATA
    // ==========================================
    function setupDropdowns() {
        const locations = [...new Set(homestaysData.map(item => item.location))];
        const sceneries = [...new Set(homestaysData.flatMap(item => item.scenery))];

        locations.forEach(loc => {
            const opt = document.createElement('option');
            opt.value = loc;
            opt.textContent = loc;
            locationFilter.appendChild(opt);
        });

        sceneries.forEach(sc => {
            const opt = document.createElement('option');
            opt.value = sc;
            opt.textContent = sc;
            sceneFilter.appendChild(opt);
        });
    }

    // ==========================================
    // 4. RENDER HOMESTAY CARDS
    // ==========================================
    function renderCards(data) {
        grid.innerHTML = '';

        if (data.length === 0) {
            grid.innerHTML = '<div class="no-results">No homestays match your search criteria.</div>';
            return;
        }

        data.forEach(stay => {
            const tagsHtml = stay.scenery.map(s => `<span class="tag">🌿 ${s}</span>`).join('');
            
            let buttonsHtml = '';
            if (stay.whatsapp) {
                buttonsHtml += `<a href="https://wa.me/${stay.whatsapp}" target="_blank" class="btn btn-wa">WhatsApp</a>`;
            }
            if (stay.googleMap) {
                buttonsHtml += `<a href="${stay.googleMap}" target="_blank" class="btn btn-map">Map</a>`;
            }
            if (stay.facebook) {
                buttonsHtml += `<a href="${stay.facebook}" target="_blank" class="btn btn-fb">Facebook</a>`;
            }
            if (stay.instagram) {
                buttonsHtml += `<a href="${stay.instagram}" target="_blank" class="btn btn-ig">Instagram</a>`;
            }
            if (stay.website) {
                buttonsHtml += `<a href="${stay.website}" target="_blank" class="btn btn-web">Website</a>`;
            }

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div>
                    <div class="card-header">
                        <h2>${stay.name}</h2>
                        <div class="card-location">📍 ${stay.location}</div>
                    </div>
                    <div class="price-tag">₹${stay.price} <span>/ night</span></div>
                    <div class="tags">${tagsHtml}</div>
                </div>
                <div class="links-group">${buttonsHtml}</div>
            `;
            grid.appendChild(card);
        });
    }

    // ==========================================
    // 5. FILTERING LOGIC
    // ==========================================
    function filterData() {
        const searchText = searchInput.value.toLowerCase().trim();
        const selectedLoc = locationFilter.value;
        const selectedScene = sceneFilter.value;
        const maxPrice = parseInt(priceFilter.value) || Infinity;

        const filtered = homestaysData.filter(stay => {
            const matchesSearch = stay.name.toLowerCase().includes(searchText) || 
                                  stay.location.toLowerCase().includes(searchText);
            const matchesLoc = selectedLoc === 'all' || stay.location === selectedLoc;
            const matchesScene = selectedScene === 'all' || stay.scenery.includes(selectedScene);
            const matchesPrice = stay.price <= maxPrice;

            return matchesSearch && matchesLoc && matchesScene && matchesPrice;
        });

        renderCards(filtered);
    }

    // ==========================================
    // 6. EVENT LISTENERS & INITIALIZATION
    // ==========================================
    searchInput.addEventListener('input', filterData);
    locationFilter.addEventListener('change', filterData);
    sceneFilter.addEventListener('change', filterData);
    priceFilter.addEventListener('input', filterData);

    setupDropdowns();
    renderCards(homestaysData);
</script>

</body>
</html>

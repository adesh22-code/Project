<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darjeeling Homestays Directory</title>
    <style>
        /* Modern Reset & Typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            line-height: 1.5;
        }
        
        /* Utility */
        .hidden { display: none !important; }

        /* Header */
        header {
            background: linear-gradient(135deg, #1e3a8a, #0d9488);
            color: white;
            text-align: center;
            padding: 3rem 1rem;
        }
        header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Layout Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        
        .refresh-notice {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 500;
            border: 1px solid #bae6fd;
        }

        /* Filter Box */
        .filter-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            align-items: center;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .filter-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #475569;
            display: flex;
            justify-content: space-between;
        }
        .filter-card input[type="text"], .filter-card select {
            width: 100%;
            padding: 0.625rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .filter-card input:focus, .filter-card select:focus {
            border-color: #0d9488;
        }
        
        /* Custom Range Slider */
        input[type=range] {
            width: 100%;
            margin: 7px 0;
            cursor: pointer;
        }
        #priceDisplay {
            color: #0d9488;
            font-weight: 700;
        }

        /* Grid & Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .card-img {
            height: 200px;
            width: 100%;
            object-fit: cover;
            background: #cbd5e1;
        }
        .card-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-header h2 {
            font-size: 1.25rem;
            color: #0f172a;
            margin-bottom: 0.25rem;
        }
        .card-location {
            color: #64748b;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-bottom: 0.75rem;
        }
        .price-tag {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0d9488;
            margin-bottom: 1rem;
        }
        .price-tag span {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 400;
        }

        /* Scenery Tags */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1.25rem;
        }
        .tag {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
        }

        /* Buttons */
        .btn {
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s, transform 0.1s;
            cursor: pointer;
            border: none;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: #0d9488; width: 100%; padding: 0.75rem; margin-top: auto; }
        .btn-call { background-color: #0284c7; }
        .btn-wa { background-color: #25D366; }
        .btn-map { background-color: #10b981; }
        .btn-yt { background-color: #FF0000; }
        .btn-fb { background-color: #1877F2; }
        .btn-ig { background-color: #E4405F; }
        .btn-web { background-color: #334155; }
        .btn-back { background-color: #e2e8f0; color: #1e293b; margin-bottom: 1.5rem; display: inline-block; }
        .btn-back:hover { background-color: #cbd5e1; }

        /* No Results State */
        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem;
            color: #64748b;
            font-size: 1.1rem;
        }

        /* --- Profile Page Styles --- */
        .profile-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .profile-hero {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }
        .profile-body {
            padding: 2.5rem;
        }
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .profile-title h2 {
            font-size: 2rem;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }
        .profile-desc {
            font-size: 1.05rem;
            color: #475569;
            margin-bottom: 2rem;
            line-height: 1.7;
        }
        .profile-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
        }
        
        @media (max-width: 600px) {
            .profile-hero { height: 250px; }
            .profile-body { padding: 1.5rem; }
            .profile-header { flex-direction: column; }
        }
    </style>
</head>
<body>

<header>
    <h1>Darjeeling Homestays Directory</h1>
    <p>Find local stays across Darjeeling, Lamahatta, Sitong, Takdah, and beyond.</p>
</header>

<div class="container">
    
    <!-- ================= MAIN DIRECTORY VIEW ================= -->
    <div id="main-view">
        <div class="refresh-notice">
            💡 Showing 10 unique homestays. Refresh the page to discover 10 different hidden gems!
        </div>

        <!-- Filter Section -->
        <div class="filter-card">
            <div class="filter-group">
                <label for="searchInput">Search Name</label>
                <input type="text" id="searchInput" placeholder="e.g. Kanchenjunga..." />
            </div>
            <div class="filter-group">
                <label for="locationFilter">Location (Current View)</label>
                <select id="locationFilter">
                    <option value="all">All Locations</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="sceneFilter">Scenery (Current View)</label>
                <select id="sceneFilter">
                    <option value="all">All Scenery</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="priceFilter">
                    Max Price <span id="priceDisplay">₹5000</span>
                </label>
                <input type="range" id="priceFilter" min="500" max="5000" step="100" value="5000" />
            </div>
        </div>

        <!-- Homestays Grid -->
        <div class="grid" id="homestayGrid"></div>
    </div>

    <!-- ================= HOMESTAY PROFILE VIEW ================= -->
    <div id="profile-view" class="hidden">
        <button class="btn btn-back" onclick="closeProfile()">← Back to Directory</button>
        
        <div class="profile-card" id="profileContainer">
            <!-- Profile content will be injected here via JS -->
        </div>
    </div>

</div>

<script>
    // ==========================================
    // 1. EXTENDED JSON DATA (20+ Items for rotation)
    // ==========================================
    const allHomestaysData = [
        { id: 1, name: "Kanchenjunga Cascade Homestay", location: "Lamahatta", price: 1500, scenery: ["Kanchenjunga View", "Pine Forest"], description: "Nestled in the serene pine forests of Lamahatta.", image: "https://images.unsplash.com/photo-1544463428-21d3e8e6ab20?auto=format&fit=crop&w=800&q=80", phone: "+919876543210", whatsapp: "919876543210", googleMap: "#", youtube: "#" },
        { id: 2, name: "Sitong Orange Blossom Stay", location: "Sitong", price: 1800, scenery: ["Orange Orchard", "Valley View"], description: "Wake up to the sweet scent of citrus and valley views.", image: "https://images.unsplash.com/photo-1506012787146-f92b2d7d6d96?auto=format&fit=crop&w=800&q=80", phone: "+919876543211", whatsapp: "919876543211", googleMap: "#" },
        { id: 3, name: "Takdah Heritage Eco Lodge", location: "Takdah", price: 2200, scenery: ["Tea Garden", "Pine Forest"], description: "Colonial charm in a British-era heritage bungalow.", image: "https://images.unsplash.com/photo-1510798831971-661eb04b3739?auto=format&fit=crop&w=800&q=80", phone: "+919876543212", whatsapp: "919876543212", googleMap: "#" },
        { id: 4, name: "Darjeeling Mist Haven", location: "Darjeeling Town", price: 1200, scenery: ["Town View", "Kanchenjunga View"], description: "A cozy stay just 15 minutes from the Mall Road.", image: "https://images.unsplash.com/photo-1626014903706-5381ce5b5b04?auto=format&fit=crop&w=800&q=80", phone: "+919876543213", whatsapp: "919876543213", googleMap: "#" },
        { id: 5, name: "Mirik Lake View Cottage", location: "Mirik", price: 2000, scenery: ["Lake View", "Tea Garden"], description: "Wake up to the tranquil waters of Sumendu Lake.", image: "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=800&q=80", phone: "+919876543214", whatsapp: "919876543214", googleMap: "#" },
        { id: 6, name: "Kurseong Cloud 9 Retreat", location: "Kurseong", price: 2500, scenery: ["Valley View", "Tea Garden"], description: "Luxury rooms hovering above the clouds of Kurseong.", image: "https://images.unsplash.com/photo-1587313632749-db3cbdb669eb?auto=format&fit=crop&w=800&q=80", phone: "+919876543215", whatsapp: "919876543215", googleMap: "#" },
        { id: 7, name: "Tinchuley Sunrise Villa", location: "Tinchuley", price: 1600, scenery: ["Kanchenjunga View", "Village View"], description: "Experience rural peace and perfect sunrise views.", image: "https://images.unsplash.com/photo-1542314831-c6a420325160?auto=format&fit=crop&w=800&q=80", phone: "+919876543216", whatsapp: "919876543216", googleMap: "#" },
        { id: 8, name: "Kalimpong Orchid House", location: "Kalimpong", price: 1900, scenery: ["Mountain View", "Garden View"], description: "Stay amidst thousands of blooming orchids.", image: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=800&q=80", phone: "+919876543217", whatsapp: "919876543217", googleMap: "#" },
        { id: 9, name: "Lepchajagat Pine Breeze", location: "Lepchajagat", price: 1400, scenery: ["Pine Forest", "Kanchenjunga View"], description: "Deep in the forest reserve, perfect for introspection.", image: "https://images.unsplash.com/photo-1499696010180-025ef6e1a8f9?auto=format&fit=crop&w=800&q=80", phone: "+919876543218", whatsapp: "919876543218", googleMap: "#" },
        { id: 10, name: "Chatakpur Eco Village Stay", location: "Chatakpur", price: 1700, scenery: ["Forest View", "Kanchenjunga View"], description: "An eco-friendly stay in a wildlife sanctuary.", image: "https://images.unsplash.com/photo-1518182170546-076616fdfaaf?auto=format&fit=crop&w=800&q=80", phone: "+919876543219", whatsapp: "919876543219", googleMap: "#" },
        { id: 11, name: "Rishyap Snow Peak", location: "Rishyap", price: 1300, scenery: ["Kanchenjunga View", "Valley View"], description: "A remote and peaceful hamlet.", image: "https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=800&q=80", phone: "+919876543220", whatsapp: "919876543220", googleMap: "#" },
        { id: 12, name: "Lava Monastery Retreat", location: "Lava", price: 1500, scenery: ["Pine Forest", "Town View"], description: "Close to the famous Kagyu Thekchen Ling Monastery.", image: "https://images.unsplash.com/photo-1519331379826-f10be5486c6f?auto=format&fit=crop&w=800&q=80", phone: "+919876543221", whatsapp: "919876543221", googleMap: "#" },
        { id: 13, name: "Makaibari Tea Estate Stay", location: "Kurseong", price: 3000, scenery: ["Tea Garden"], description: "Stay inside the world-famous Makaibari tea estate.", image: "https://images.unsplash.com/photo-1587313632749-db3cbdb669eb?auto=format&fit=crop&w=800&q=80", phone: "+919876543222", whatsapp: "919876543222", googleMap: "#" },
        { id: 14, name: "Bijanbari River Camp", location: "Bijanbari", price: 2100, scenery: ["River View", "Valley View"], description: "Sleep to the sound of the Rangeet river.", image: "https://images.unsplash.com/photo-1504280390224-dd979d36ed81?auto=format&fit=crop&w=800&q=80", phone: "+919876543223", whatsapp: "919876543223", googleMap: "#" },
        { id: 15, name: "Sukhiapokhri Foggy Nights", location: "Sukhiapokhri", price: 1100, scenery: ["Pine Forest", "Valley View"], description: "Misty mornings and cozy campfires.", image: "https://images.unsplash.com/photo-1444491741275-3747c53c99b4?auto=format&fit=crop&w=800&q=80", phone: "+919876543224", whatsapp: "919876543224", googleMap: "#" },
        { id: 16, name: "Ghoom Heritage Stays", location: "Ghoom", price: 1800, scenery: ["Town View"], description: "Right next to the famous Ghoom Railway Station.", image: "https://images.unsplash.com/photo-1626014903706-5381ce5b5b04?auto=format&fit=crop&w=800&q=80", phone: "+919876543225", whatsapp: "919876543225", googleMap: "#" },
        { id: 17, name: "Phalut Trekker's Hut", location: "Phalut", price: 900, scenery: ["Kanchenjunga View"], description: "Basecamp for trekkers aiming for Sandakphu.", image: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=800&q=80", phone: "+919876543226", whatsapp: "919876543226", googleMap: "#" },
        { id: 18, name: "Sandakphu Summit Lodge", location: "Sandakphu", price: 2800, scenery: ["Kanchenjunga View"], description: "The highest homestay in West Bengal.", image: "https://images.unsplash.com/photo-1544463428-21d3e8e6ab20?auto=format&fit=crop&w=800&q=80", phone: "+919876543227", whatsapp: "919876543227", googleMap: "#" },
        { id: 19, name: "Latpanchar Hornbill Nest", location: "Latpanchar", price: 1600, scenery: ["Forest View", "Village View"], description: "The best place to spot the Rufous-necked Hornbill.", image: "https://images.unsplash.com/photo-1506012787146-f92b2d7d6d96?auto=format&fit=crop&w=800&q=80", phone: "+919876543228", whatsapp: "919876543228", googleMap: "#" },
        { id: 20, name: "Singalila Forest Rest", location: "Singalila", price: 2000, scenery: ["Forest View", "Mountain View"], description: "Deep in the national park, pure wilderness.", image: "https://images.unsplash.com/photo-1510798831971-661eb04b3739?auto=format&fit=crop&w=800&q=80", phone: "+919876543229", whatsapp: "919876543229", googleMap: "#" }
    ];

    let activeHomestays = []; // This will hold the 10 rotational homestays

    // ==========================================
    // 2. EQUAL CHANCE ROTATION LOGIC (Session Storage)
    // ==========================================
    function initializeRotation() {
        const BATCH_SIZE = 10;
        let unshownIds = JSON.parse(sessionStorage.getItem('unshownHomestays'));

        // If no data or array is empty (all shown), reset the pool
        if (!unshownIds || unshownIds.length === 0) {
            const allIds = allHomestaysData.map(h => h.id);
            // Shuffle array using Fisher-Yates logic
            unshownIds = allIds.sort(() => 0.5 - Math.random());
        }

        // Take the top 10 from the pool
        const currentBatchIds = unshownIds.splice(0, BATCH_SIZE);

        // Save the remaining IDs back to session storage
        sessionStorage.setItem('unshownHomestays', JSON.stringify(unshownIds));

        // Filter master array to only include the current 10 items
        activeHomestays = allHomestaysData.filter(h => currentBatchIds.includes(h.id));
    }

    // ==========================================
    // 3. DOM ELEMENTS
    // ==========================================
    const mainView = document.getElementById('main-view');
    const profileView = document.getElementById('profile-view');
    const profileContainer = document.getElementById('profileContainer');
    
    const grid = document.getElementById('homestayGrid');
    const searchInput = document.getElementById('searchInput');
    const locationFilter = document.getElementById('locationFilter');
    const sceneFilter = document.getElementById('sceneFilter');
    const priceFilter = document.getElementById('priceFilter');
    const priceDisplay = document.getElementById('priceDisplay');

    // ==========================================
    // 4. AUTO-POPULATE FILTER DROPDOWNS (From Active 10)
    // ==========================================
    function setupDropdowns() {
        const locations = [...new Set(activeHomestays.map(item => item.location))].sort();
        const sceneries = [...new Set(activeHomestays.flatMap(item => item.scenery))].sort();

        locations.forEach(loc => {
            const opt = document.createElement('option');
            opt.value = loc;
            opt.textContent = loc;
            locationFilter.appendChild(opt);
        });

        sceneries.forEach(sc => {
            const opt = document.createElement('option');
            opt.value = sc;
            opt.textContent = sc;
            sceneFilter.appendChild(opt);
        });
    }

    // ==========================================
    // 5. RENDER MAIN DIRECTORY CARDS
    // ==========================================
    function renderCards(data) {
        grid.innerHTML = '';

        if (data.length === 0) {
            grid.innerHTML = '<div class="no-results">No homestays match your search criteria.</div>';
            return;
        }

        data.forEach(stay => {
            const tagsHtml = stay.scenery.map(s => `<span class="tag">🌿 ${s}</span>`).join('');

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${stay.image}" alt="${stay.name}" class="card-img" />
                <div class="card-content">
                    <div class="card-header">
                        <h2>${stay.name}</h2>
                        <div class="card-location">📍 ${stay.location}</div>
                    </div>
                    <div class="price-tag">₹${stay.price} <span>/ night</span></div>
                    <div class="tags">${tagsHtml}</div>
                    <button class="btn btn-primary" onclick="openProfile(${stay.id})">View Details</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // ==========================================
    // 6. PROFILE PAGE LOGIC (SPA Navigation)
    // ==========================================
    function openProfile(id) {
        const stay = activeHomestays.find(s => s.id === id);
        if (!stay) return;

        let buttonsHtml = '';
        if (stay.phone) buttonsHtml += `<a href="tel:${stay.phone}" class="btn btn-call">📞 Call Now</a>`;
        if (stay.whatsapp) buttonsHtml += `<a href="https://wa.me/${stay.whatsapp}" target="_blank" class="btn btn-wa">💬 WhatsApp</a>`;
        if (stay.googleMap) buttonsHtml += `<a href="${stay.googleMap}" target="_blank" class="btn btn-map">📍 Get Directions</a>`;
        if (stay.youtube) buttonsHtml += `<a href="${stay.youtube}" target="_blank" class="btn btn-yt">📺 Tour Video</a>`;

        const tagsHtml = stay.scenery.map(s => `<span class="tag" style="font-size:0.9rem;">🌿 ${s}</span>`).join('');

        profileContainer.innerHTML = `
            <img src="${stay.image}" alt="${stay.name}" class="profile-hero" />
            <div class="profile-body">
                <div class="profile-header">
                    <div class="profile-title">
                        <h2>${stay.name}</h2>
                        <div class="card-location" style="font-size:1.1rem;">📍 ${stay.location}</div>
                    </div>
                    <div class="price-tag" style="font-size:1.8rem; margin:0;">
                        ₹${stay.price} <span style="font-size:1rem;">/ night</span>
                    </div>
                </div>
                
                <div class="tags" style="margin-bottom: 1.5rem;">${tagsHtml}</div>
                
                <div class="profile-desc">
                    <strong>About this homestay:</strong><br/>
                    ${stay.description}
                </div>

                <div class="profile-actions">
                    ${buttonsHtml}
                </div>
            </div>
        `;

        mainView.classList.add('hidden');
        profileView.classList.remove('hidden');
        window.scrollTo(0, 0); 
    }

    function closeProfile() {
        profileView.classList.add('hidden');
        mainView.classList.remove('hidden');
        window.scrollTo(0, 0);
    }

    // ==========================================
    // 7. FILTERING LOGIC (Applied to Active 10)
    // ==========================================
    function filterData() {
        const searchText = searchInput.value.toLowerCase().trim();
        const selectedLoc = locationFilter.value;
        const selectedScene = sceneFilter.value;
        const maxPrice = parseInt(priceFilter.value) || 5000;

        priceDisplay.textContent = `₹${maxPrice}`;

        // Filter the 10 active homestays, not the full database
        const filtered = activeHomestays.filter(stay => {
            const matchesSearch = stay.name.toLowerCase().includes(searchText) || 
                                  stay.location.toLowerCase().includes(searchText);
            const matchesLoc = selectedLoc === 'all' || stay.location === selectedLoc;
            const matchesScene = selectedScene === 'all' || stay.scenery.includes(selectedScene);
            const matchesPrice = stay.price <= maxPrice;

            return matchesSearch && matchesLoc && matchesScene && matchesPrice;
        });

        renderCards(filtered);
    }

    // ==========================================
    // 8. INITIALIZATION
    // ==========================================
    
    // 1. Grab 10 unique items for this session load
    initializeRotation();
    
    // 2. Setup DOM and Listeners
    setupDropdowns();
    renderCards(activeHomestays);
    
    searchInput.addEventListener('input', filterData);
    locationFilter.addEventListener('change', filterData);
    sceneFilter.addEventListener('change', filterData);
    priceFilter.addEventListener('input', filterData);
</script>

</body>
</html>
